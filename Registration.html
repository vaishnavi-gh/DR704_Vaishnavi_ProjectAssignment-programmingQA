<!DOCTYPE html>
<html lang="en">

<head>
        
   
<body style="background-color:lightgrey;">

<head>

<body>

    <div>

        <h1><h1 style="color: brown ;">Student Registration Form</h1>

        <p>
            Please fill in the following information to register.
        </p>

        <hr>

     
        <a href="index.html">Home</a> |
        <a href="registration.html">Registration</a> |
        <a href="students.html">Student List</a>

        <hr>

        <form>

            <h2>Personal Information</h2>

     
            <label for="studentName">Student Name:</label>
            <input type="text"
                   id="studentName"
                   name="studentName"
                   placeholder="Enter your name"
                   required>

            <br><br>


            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

  
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <br><br>


            <label for="phone">Phone Number:</label>
            <input type="text"
                   id="phone"
                   name="phone"
                   placeholder="Enter phone number">

            <br><br>

  
            <label for="dob">Date of Birth:</label>
            <input type="date"
                   id="dob"
                   name="dob">

            <br><br>

           
            <h3>Gender</h3>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="Male">

            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="Female">

            <label for="female">Female</label>

            <input type="radio"
                   id="other"
                   name="gender"
                   value="Other">

            <label for="other">Other</label>

            <br><br>

      
            <h3>Course Selection</h3>

            <label for="course">Select Course:</label>

            <select id="course" name="course">

                <option value="">-- Select Course --</option>
                <option value="Manual Testing">Manual Testing</option>
                <option value="SQL">SQL</option>
                <option value="Selenium">Selenium</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="Playwright">Playwright</option>

            </select>

            <br><br>

          
            <h3>Skills</h3>

            <input type="checkbox"
                   id="html"
                   name="skills"
                   value="HTML">

            <label for="html">HTML</label>

            <input type="checkbox"
                   id="sql"
                   name="skills"
                   value="SQL">

            <label for="sql">SQL</label>

            <input type="checkbox"
                   id="java"
                   name="skills"
                   value="Java">

            <label for="java">Java</label>

            <input type="checkbox"
                   id="python"
                   name="skills"
                   value="Python">

            <label for="python">Python</label>

            <input type="checkbox"
                   id="testing"
                   name="skills"
                   value="Testing">

            <label for="testing">Testing</label>

            <br><br>


            <label for="address">Address:</label>

            <br>

            <textarea id="address"
                      name="address"
                      rows="5"
                      cols="40"
                      placeholder="Enter your address"></textarea>

            <br><br>


            <label for="registrationDate">
                Registration Date:
            </label>

            <input type="date"
                   id="registrationDate"
                   name="registrationDate">

            <br><br>

         
            <label for="experience">
                Years of Experience:
            </label>

            <input type="number"
                   id="experience"
                   name="experience"
                   min="0"
                   max="50">

            <br><br>

            <label for="document">
                Upload Document:
            </label>

            <input type="file"
                   id="document"
                   name="document">

            <br><br>

            
            <input type="submit"
                   value="Submit Registration">

            <input type="reset"
                   value="Reset Form">

            <button type="button">
                Click Me
            </button>

        </form>

    </div>

</body>
</html>
